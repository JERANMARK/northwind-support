# SQL Server and API for local development only. The passwords below are throwaway local
# placeholders - never commit real credentials.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: supportdesk-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Local_Dev_Password1}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - supportdesk-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: supportdesk-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=SupportDesk;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Local_Dev_Password1};TrustServerCertificate=True;Encrypt=False"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-DevLocal_Default_Jwt_Signing_Secret_Key_32_Chars!}"
      Jwt__Issuer: "NorthwindSupportDesk"
      Jwt__Audience: "NorthwindSupportDesk"
      Jwt__LifetimeMinutes: "120"
      Sla__BaseWindowHours__Low: "72"
      Sla__BaseWindowHours__Medium: "24"
      Sla__BaseWindowHours__High: "8"
      Sla__BaseWindowHours__Critical: "4"
      Sla__PremiumCustomerMultiplier: "0.5"
      Sla__MinimumWindowHours: "1"
      Sla__AtRiskThresholdPercent: "25"
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  supportdesk-sql: